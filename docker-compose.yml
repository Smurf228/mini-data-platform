services:

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped

    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - platform_net

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: root
      POSTGRES_DB: appdb
    command: >
      postgres
      -c wal_level=logical
      -c max_wal_senders=10
      -c max_replication_slots=10
    restart: unless-stopped
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - platform_net

  connect:
    image: quay.io/debezium/connect:2.7
    container_name: connect
    depends_on:
      - kafka
      - postgres
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    networks:
      - platform_net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - platform_net

  dashboard:
    image: nginx:alpine
    container_name: dashboard
    depends_on:
      - kafka-ui
      - spark-master
      - minio
      - connect
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./dashboard/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - platform_net

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniodata123
    command: server /data --console-address ":9001"
    restart: unless-stopped
    volumes:
      - minio_data:/data
    networks:
      - platform_net

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio miniodata123; do sleep 1; done;
      mc mb -p local/datalake;
      exit 0;
      "
    networks:
      - platform_net

  spark-master:
    image: spark:3.5.1-python3
    container_name: spark-master
    depends_on:
      - minio
      - minio-init
    restart: unless-stopped
    ports:
    - "7077:7077"
    - "8081:8080"
    volumes:
    - ./spark/app:/opt/spark-app
    command: >
     bash -lc "/opt/spark/bin/spark-class
     org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080"
    networks:
      - platform_net

  spark-worker:
    image: spark:3.5.1-python3
    container_name: spark-worker
    depends_on:
      - spark-master
    restart: unless-stopped
    ports:
      - "8082:8081"
    command: >
      bash -lc "/opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --webui-port 8081"  
    networks:
      - platform_net

  spark-app:
    image: spark:3.5.1-python3
    container_name: spark-app
    depends_on:
      - spark-master
      - spark-worker
      - kafka
      - minio
    restart: unless-stopped
    volumes:
      - ./spark/app:/opt/spark-app
    command: >
      bash -lc "mkdir -p /tmp/.ivy && /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --total-executor-cores 2
      --conf spark.jars.ivy=/tmp/.ivy
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,io.delta:delta-spark_2.12:3.2.0,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262
      /opt/spark-app/stream_job.py"
    networks:
      - platform_net
  

volumes:
  kafka_data:
  postgres_data:
  minio_data:

networks:
  platform_net:
    driver: bridge
